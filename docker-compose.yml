services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=computebestspecs
    ports:
      - "5432:5432"
    volumes:
      - cbs-db-data:/var/lib/postgresql/data
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/computebestspecs
      - NEXT_PUBLIC_ENGINE_VERSION=1.0.0
      - NODE_ENV=production
    depends_on:
      - db
    restart: always

volumes:
  cbs-db-data:
